name: Actualizar licitaciones diarias

on:
  schedule:
    # Todos los días a las 06:15 UTC (~08:15 hora de España en invierno, 07:15 en verano)
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar base de datos SQLite de la ejecución anterior
        uses: actions/cache@v4
        with:
          path: data/licitaciones.db
          key: licitaciones-db-tech-v1-${{ github.run_id }}
          restore-keys: |
            licitaciones-db-tech-v1-

      - name: Ejecutar fetch_licitaciones.py
        run: |
          # En enero incluimos también el año anterior por si hay expedientes a caballo
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" = "01" ]; then
            PREV=$((YEAR - 1))
            python fetch_licitaciones.py --years "$PREV" "$YEAR"
          else
            python fetch_licitaciones.py --years "$YEAR"
          fi

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Actualización diaria de licitaciones $(date -u +%Y-%m-%d)"
          # No versionamos el .db (puede pesar mucho); se cachea con actions/cache
          git push

      - name: Preparar carpeta para GitHub Pages
        run: |
          mkdir -p site
          cp dashboard.html site/index.html
          mkdir -p site/data
          cp data/latest.json site/data/latest.json
          cp data/nuevas_hoy.json site/data/nuevas_hoy.json

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
