[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ginebra"
version = "1.0.0"
description = "Feed propio de licitaciones públicas españolas construido sobre los datos abiertos de PLACSP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ginebra = "ginebra.cli:main"

[tool.setuptools.packages.find]
include = ["ginebra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
